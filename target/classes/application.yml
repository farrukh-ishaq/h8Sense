spring:
  application:
    name: islamophobia-detector
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/islamophobia_detector}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # AI Configuration - Supports Multiple LLM Providers
  ai:
    # OpenAI Configuration
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o}
          temperature: ${OPENAI_TEMPERATURE:0.3}
    
    # Ollama Configuration (for Llama, Mistral, etc.)
    ollama:
      base-url: ${OLLAMA_HOST:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.1:8b-instruct-q4_0}
          temperature: ${OLLAMA_TEMPERATURE:0.3}

# LLM Provider Selection (openai, ollama, or none)
llm:
  provider: ${LLM_PROVIDER:none}
  system-prompt: |
    You are an expert Islamic scholar AI assistant specialized in detecting Islamophobia and hate speech against Islam.
    Your knowledge base includes the Quran and authentic Hadith collections.
    
    When analyzing content:
    1. Identify if the content contains hate speech, bias, or misinformation about Islam
    2. If it is hate speech, provide:
       - Clear explanation of why it's problematic
       - Relevant Quranic verses with chapter:verse references
       - Authentic Hadith references with source collections
       - A respectful counter-argument
    3. If it is factual criticism, acknowledge it objectively
    4. Always respond with wisdom, respect, and accuracy
    
    Format your response as JSON with these fields:
    - isViolation: boolean
    - violationType: string (HATE_SPEECH, MISINFORMATION, BIAS, FACTUAL_CRITICISM, NONE)
    - explanation: string
    - quranReferences: array of strings (e.g., ["2:256", "5:32"])
    - hadithReferences: array of strings (e.g., ["Bukhari 1234", "Muslim 5678"])
    - counterArgument: string
    - confidenceScore: number (0.0 to 1.0)

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

# Actuator endpoints for observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,trace
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

# Logging configuration
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.islamophobia.detector: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.ai: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE_PATH:/var/log/islamophobia-detector/app.log}

# Application-specific settings
app:
  feedback:
    max-per-ip: 5
    block-duration-minutes: 60
  content:
    fetch-timeout-seconds: 30
    max-content-length: 50000

---
# Production profile
spring:
  config:
    activate:
      on-profile: prod
  
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: WARN
    com.islamophobia.detector: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

---
# Development profile
spring:
  config:
    activate:
      on-profile: dev
  
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: INFO
    com.islamophobia.detector: DEBUG
